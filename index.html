<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Top 100 Global Ranking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --bg: #0a0c10;
      --surface: #12161f;
      --surface-2: #171c28;
      --line: #232a3a;
      --line-soft: #1a2130;
      --text: #e8edf5;
      --text-dim: #8b97ad;
      --text-faint: #5a6680;
      --accent: #4d7cfe;
      --gold: #d4af6a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 56px;
      display: flex;
      justify-content: center;
      line-height: 1.4;
    }

    .board {
      width: 100%;
      max-width: 560px;
    }

    /* ---------- Header ---------- */
    .header {
      margin-bottom: 28px;
      padding: 0 4px;
    }

    .header-eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header-title em {
      font-style: normal;
      color: var(--text-faint);
      font-weight: 500;
    }

    /* ---------- Champion card ---------- */
    .champion {
      position: relative;
      background: linear-gradient(160deg, #1a2138 0%, #12161f 55%, #0d1017 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px 22px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .champion::before {
      content: '';
      position: absolute;
      top: -60%;
      left: -10%;
      width: 70%;
      height: 220%;
      background: radial-gradient(ellipse, rgba(77, 124, 254, 0.16), transparent 65%);
      pointer-events: none;
    }

    .champion-pic {
      position: relative;
      flex-shrink: 0;
    }

    .champion-pic img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid var(--gold);
      background: var(--surface-2);
    }

    .champion-pic::after {
      content: '1';
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold);
      color: #1a1408;
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--bg);
    }

    .champion-info {
      min-width: 0;
      flex: 1;
    }

    .champion-label {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .champion-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .champion-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flag-icon {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
    }

    .champion-caption {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.06em;
      opacity: 0.85;
      margin-bottom: 6px;
      font-style: italic;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .champion-pts {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }

    .champion-pts strong {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .champion-pts span {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* ---------- Runners-up (2 & 3) — stacked rows ---------- */
    .runners {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .runner {
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .runner-pic {
      position: relative;
      flex-shrink: 0;
    }

    .runner-pic img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1.5px solid var(--line);
      background: var(--surface-2);
    }

    .runner-pic::after {
      content: attr(data-rank);
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-dim);
      font-size: 0.68rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }

    .runner-info {
      min-width: 0;
      flex: 1;
    }

    .runner-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .runner-name {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .runner-flag {
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .runner-caption {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.06em;
      opacity: 0.8;
      margin-bottom: 2px;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .runner-pts {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* ---------- List ---------- */
    .list-head {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      padding: 0 14px 10px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 4px;
    }

    .list-head span {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .list-head span:last-child {
      text-align: right;
    }

    .row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 11px 14px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .row:hover {
      background: var(--surface);
    }

    .row-rank {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .row-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .row-profile img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1px solid var(--line-soft);
      background: var(--surface-2);
      flex-shrink: 0;
    }

    .row-name-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .row-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-flag {
      font-size: 0.9rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .row-caption {
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.05em;
      opacity: 0.7;
      font-style: italic;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-pts {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      text-align: right;
    }

    /* ---------- Mobile tweaks ---------- */
    @media (max-width: 380px) {
      body { padding: 20px 10px 40px; }

      .header-title { font-size: 1.5rem; }

      .champion { padding: 22px 18px 20px; gap: 14px; }
      .champion-pic img { width: 76px; height: 76px; }
      .champion-name { font-size: 1.1rem; }
      .champion-pts strong { font-size: 1.15rem; }
      .champion-caption { font-size: 0.65rem; }
      .flag-icon { font-size: 1.1rem; }

      .runner { padding: 12px 14px; gap: 12px; }
      .runner-pic img { width: 46px; height: 46px; }
      .runner-caption { font-size: 0.6rem; }
      .runner-flag { font-size: 0.9rem; }

      .row { padding: 10px 10px; gap: 10px; }
      .row-rank { font-size: 0.78rem; }
      .row-profile { gap: 10px; }
      .row-profile img { width: 30px; height: 30px; }
      .row-name { font-size: 0.85rem; }
      .row-pts { font-size: 0.8rem; }
      .row-flag { font-size: 0.8rem; }
      .row-caption { font-size: 0.55rem; }
    }
  </style>
</head>

    // ---------- render ----------
    (function () {
      const players = PLAYERS_JSON;
      const [first_, second_, third_, ...rest] = players;
      const fmt = n => n.toLocaleString('en-US');

      const initials = name =>
        name.split(' ').map(w => w[0]).join('').slice(0, 2);

      // --- podium ---
      document.getElementById('podium').innerHTML = `
        <div class="champion">
          <div class="champion-pic">
            <img src="${first_.avatar}" alt="${first_.name}"
                 onerror="this.src='https://ui-avatars.com/api/?background=1a2138&color=d4af6a&bold=true&name=${encodeURIComponent(initials(first_.name))}'">
          </div>
          <div class="champion-info">
            <div class="champion-label">Champion</div>
            <div class="champion-name-row">
              <span class="champion-name">${first_.name}</span>
              <span class="flag-icon">${first_.flag}</span>
            </div>
            ${first_.caption ? `<div class="champion-caption">“${first_.caption}”</div>` : ''}

              <strong>${fmt(first_.pts)}</strong>
              <span>PTS</span>
            </div>
          </div>
        </div>

        <div class="runners">
          <div class="runner">
            <div class="runner-pic" data-rank="2">
              <img src="${second_.avatar}" alt="${second_.name}"
                   onerror="this.src='https://ui-avatars.com/api/?background=1a2138&color=8b97ad&bold=true&name=${encodeURIComponent(initials(second_.name))}'">
            </div>
            <div class="runner-info">
              <div class="runner-name-row">
                <span class="runner-name">${second_.name}</span>
                <span class="runner-flag">${second_.flag}</span>
              </div>
              ${second_.caption ? `<div class="runner-caption">“${second_.caption}”</div>` : ''}
              <div class="runner-pts">${fmt(second_.pts)} pts</div>
            </div>
          </div>
          <div class="runner">
            <div class="runner-pic" data-rank="3">
              <img src="${third_.avatar}" alt="${third_.name}"
                   onerror="this.src='https://ui-avatars.com/api/?background=1a2138&color=8b97ad&bold=true&name=${encodeURIComponent(initials(third_.name))}'">
            </div>
            <div class="runner-info">
              <div class="runner-name-row">
                <span class="runner-name">${third_.name}</span>
                <span class="runner-flag">${third_.flag}</span>
              </div>
              ${third_.caption ? `<div class="runner-caption">“${third_.caption}”</div>` : ''}
              <div class="runner-pts">${fmt(third_.pts)} pts</div>
            </div>
          </div>
        </div>
      `;

      // --- list 4–100 ---
      document.getElementById('list').innerHTML = rest.map(p => `
        <div class="row">
          <div class="row-rank">${p.rank}</div>
          <div class="row-profile">
            <img src="${p.avatar}" alt="${p.name}" loading="lazy"
